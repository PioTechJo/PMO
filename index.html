
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pio-Tech Portal</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Inter"', '"Plus Jakarta Sans"', '"Tajawal"', 'sans-serif'],
            },
            colors: {
              brand: {
                primary: '#6366f1',
                secondary: '#8b5cf6',
                dark: '#0f172a',
                card: '#ffffff',
                cardDark: '#1e293b'
              },
              violet: {
                '50': '#f5f3ff', '100': '#ede9fe', '200': '#ddd6fe', '300': '#c4b5fd',
                '400': '#a78bfa', '500': '#8b5cf6', '600': '#7c3aed', '700': '#6d28d9',
                '800': '#5b21b6', '900': '#4c1d95', '950': '#2e1065',
              },
              indigo: {
                '50': '#eef2ff', '100': '#e0e7ff', '200': '#c7d2fe', '300': '#a5b4fc',
                '400': '#818cf8', '500': '#6366f1', '600': '#4f46e5', '700': '#4338ca',
                '800': '#3730a3', '900': '#312e81', '950': '#1e1b4b',
              },
            },
            borderRadius: {
                '4xl': '2.5rem',
            }
          },
        },
      }
    </script>
    <style>
        body {
            font-family: 'Inter', 'Plus Jakarta Sans', 'Tajawal', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: #f8fafc;
        }
        .dark body {
            background-color: #0f172a;
        }
        #root {
            position: relative;
            z-index: 1;
        }
        /* إضاءة خلفية ناعمة كما في الصور */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                radial-gradient(circle at 0% 0%, rgba(139, 92, 246, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(99, 102, 241, 0.05) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.2);
            border-radius: 10px;
        }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>

  "imports": {

    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.24.0",
    "react-dropzone": "https://aistudiocdn.com/react-dropzone@^14.3.8",
    "@supabase/supabase-js": "https://aistudiocdn.com/@supabase/supabase-js@^2.44.0"
  }
}
</script>
    <script type="module" src="/index.tsx"></script>
